[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-website-detector"
version = "1.0.0"
description = "Educational ML-based phishing URL detector"
requires-python = ">=3.11,<3.14"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
